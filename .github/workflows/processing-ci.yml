name: Processing CI

on:
  push:
    branches: [main]
    paths:
      - "processing/**"
      - ".github/workflows/processing-ci.yml"
  pull_request:
    paths:
      - "processing/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: processing/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
