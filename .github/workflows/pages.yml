name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inyectar URL de Firebase (opcional)
        env:
          FIREBASE_DB_URL: ${{ vars.FIREBASE_DB_URL }}
        run: |
          if [ -n "$FIREBASE_DB_URL" ]; then
            sed -i "s|FIREBASE_DB_URL: \".*\"|FIREBASE_DB_URL: \"${FIREBASE_DB_URL%/}\"|" frontend/js/config.js
            echo "FIREBASE_DB_URL configurada: ${FIREBASE_DB_URL%/}"
          else
            echo "Se usa la URL de Firebase definida en frontend/js/config.js"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v4
