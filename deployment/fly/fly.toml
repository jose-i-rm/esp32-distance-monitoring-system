# Fly.io - ESP32 Distance Monitoring System (backend)
# Copie este archivo a backend/fly.toml y ejecute desde backend/:
#   fly launch --no-deploy --copy-config
#   fly deploy

app = "esp32-distance-api"
primary_region = "bog"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  CORS_ORIGINS = "https://jose-i-rm.github.io"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
