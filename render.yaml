databases:
  - name: esp32-monitoring-db
    plan: free
    databaseName: esp32_monitoring
    user: esp32

services:
  - type: web
    name: esp32-distance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esp32-monitoring-db
          property: connectionString
      - key: DEVICE_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://jose-i-rm.github.io
