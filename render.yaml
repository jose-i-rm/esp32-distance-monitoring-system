databases:
  - name: esp32-monitoring-db
    plan: free
    databaseName: esp32_monitoring
    user: esp32

services:
  - type: web
    name: esp32-distance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esp32-monitoring-db
          property: connectionString
      - key: DEVICE_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://jose-i-rm.github.io
      - key: ADMIN_API_KEY
        generateValue: true
      # Secretos de Tuya: definir en el panel de Render (sync: false = no se guardan en el repo)
      - key: TUYA_ACCESS_ID
        sync: false
      - key: TUYA_ACCESS_SECRET
        sync: false
      - key: TUYA_DEVICE_ID
        sync: false
      - key: TUYA_ENDPOINT
        value: https://openapi.tuyaus.com
      - key: TUYA_POLL_INTERVAL_SECONDS
        value: "300"
