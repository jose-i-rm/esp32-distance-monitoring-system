# Blueprint de Render: backend FastAPI (cámara PTZ Tuya) desplegado desde este repositorio de GitHub.
# Se redespliega automáticamente con cada push a main que modifique backend/.
#
# Base de datos: SQLite en el contenedor (/tmp). Render elimina las PostgreSQL gratuitas a los 30 días;
# los eventos de la cámara se vuelven a sincronizar desde Tuya Cloud (7 días de historial) con el sondeo.
services:
  - type: web
    name: esp32-distance-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/esp32_monitoring.db
      - key: DEVICE_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://jose-i-rm.github.io
      - key: ADMIN_API_KEY
        generateValue: true
      # Secretos de Tuya: se introducen en el panel de Render (sync: false = no se guardan en el repo)
      - key: TUYA_ACCESS_ID
        sync: false
      - key: TUYA_ACCESS_SECRET
        sync: false
      - key: TUYA_DEVICE_ID
        sync: false
      - key: TUYA_ENDPOINT
        value: https://openapi.tuyaus.com
      - key: TUYA_POLL_INTERVAL_SECONDS
        value: "300"
      # Seguimiento radar -> cámara: lee /stats/last_alert de Firebase (lectura pública) cada 3 s.
      - key: FIREBASE_DB_URL
        value: https://esp32-distance-jirm-450f1-default-rtdb.firebaseio.com
      - key: RADAR_WATCH_INTERVAL_SECONDS
        value: "3"
      # Presets guardados en la app Tuya Smart -> ángulo del servo al que apunta cada uno (p. ej. "1:0,2:45,3:90,4:135,5:180").
      - key: PTZ_PRESET_ANGLES
        sync: false
      - key: PTZ_SETTLE_SECONDS
        value: "4"
      - key: SNAPSHOT_SKIP_SECONDS
        value: "6"
      - key: RADAR_CAPTURE_COOLDOWN_SECONDS
        value: "30"
